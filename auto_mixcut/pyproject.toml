[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mixcut"
version = "0.1.0"
description = "TikTok Shop product intelligent mixcut pipeline"
requires-python = ">=3.9"
dependencies = ["numpy>=1.26,<3", "oss2>=2.18", "openai>=1.0,<3", "Pillow>=10,<12", "urllib3<2"]

[project.scripts]
auto_mixcut = "auto_mixcut.cli:main"

[tool.setuptools.packages.find]
where = ["."]
