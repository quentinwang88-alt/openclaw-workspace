[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miaoshou-auto-listing"
version = "0.2.0"
description = "Deterministic Playwright executor for Miaoshou product publishing"
requires-python = ">=3.9"
dependencies = [
  "playwright>=1.45",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "requests>=2.31",
  "openai>=2.0",
  "httpx[socks]>=0.28",
]

[project.scripts]
miaoshou-listing = "miaoshou_auto_listing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
